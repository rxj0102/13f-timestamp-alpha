name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Rerun both parts offline and confirm the committed results reproduce
        run: |
          cp results/hidden_summary.json /tmp/hidden.json
          cp results/filing_timing_summary.json /tmp/timing.json
          python scripts/hidden_study.py > /dev/null
          python scripts/compare_metrics.py /tmp/hidden.json results/hidden_summary.json
          python scripts/filing_timing_study.py > /dev/null
          diff /tmp/timing.json results/filing_timing_summary.json
      - run: python scripts/render_hidden.py --check
      - run: python scripts/filing_timing_study.py --check
