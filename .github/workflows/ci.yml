name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Rerun the study offline and confirm it reproduces the committed results
        run: |
          cp results/filing_timing_summary.json /tmp/committed.json
          python scripts/filing_timing_study.py > /dev/null
          diff /tmp/committed.json results/filing_timing_summary.json
      - name: README matches results/
        run: python scripts/filing_timing_study.py --check
